[package]
name = "px-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
px-core = { path = "../px-core" }
px-ui = { path = "../px-ui" }
px-formats = { path = "../px-formats" }
eframe = { version = "=0.37.0", default-features = false, features = ["glow"] }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["glow", "x11", "wayland"] }
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal", "wayland"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = { version = "=0.17.2", default-features = false }

[dev-dependencies]
proptest = "1.12.0"
