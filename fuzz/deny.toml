# Configuración de `cargo deny` para la crate del fuzzer (fuera del workspace). Se comprueba con:
#   cargo deny --manifest-path fuzz/Cargo.toml --locked --config fuzz/deny.toml check
# El CI no la ejecuta (specs/hito-1-fuzz.md, specs/hito-2-puerta.md D9).

[licenses]
# La misma lista que el `deny.toml` de la raíz, sin ninguna otra: si una cambia, cambia la otra.
# Nunca GPL, LGPL ni AGPL.
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0"]
confidence-threshold = 0.9

# 2026-10-17 (movida aquí el 2026-10-20): `libfuzzer-sys` tiene la licencia
# `(MIT OR Apache-2.0) AND NCSA`: NCSA es obligatoria porque empaqueta libFuzzer (LLVM).
# NCSA es permisiva y no entra en ningún binario de Pixoko, así que se admite solo para esa
# crate y no en `allow`. Ver specs/hito-1-fuzz.md y docs/DEPENDENCIES.md.
[[licenses.exceptions]]
crate = "libfuzzer-sys"
allow = ["NCSA"]
