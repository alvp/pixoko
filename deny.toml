[licenses]
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0"]
confidence-threshold = 0.9

# 2026-10-17: `libfuzzer-sys` (solo en fuzz/, fuera del workspace) tiene la licencia
# `(MIT OR Apache-2.0) AND NCSA`: NCSA es obligatoria porque empaqueta libFuzzer (LLVM).
# NCSA es permisiva y no entra en ningún binario de Pixoko, así que se admite solo para esa
# crate y no en `allow`. Ver specs/hito-1-fuzz.md y docs/DEPENDENCIES.md.
[[licenses.exceptions]]
crate = "libfuzzer-sys"
allow = ["NCSA"]
